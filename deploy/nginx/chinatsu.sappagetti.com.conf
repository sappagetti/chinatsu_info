# Host nginx (VPS) — TLS termination in front of docker-compose frontend (:8081).
# Install: scripts/vps-ensure-tls.sh (or copy into sites-available / conf.d).
#
# Critical: ACME HTTP-01 must be served on :80 WITHOUT redirecting to HTTPS.
# If /.well-known/acme-challenge/ is redirected or proxied to the SPA, renewals
# silently fail and the Let's Encrypt cert expires after 90 days.

upstream chinatsu_frontend {
    server 127.0.0.1:8081;
    keepalive 16;
}

# HTTP: ACME webroot + redirect everything else to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name chinatsu.sappagetti.com;

    # Prefer this prefix match over any catch-all redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: terminate TLS, proxy to Compose frontend
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chinatsu.sappagetti.com;

    ssl_certificate     /etc/letsencrypt/live/chinatsu.sappagetti.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chinatsu.sappagetti.com/privkey.pem;

    # Present when certbot's nginx plugin (or certbot --nginx) was used once.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Final HSTS lives on the edge that terminates TLS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Bookmarklet ingest payloads can exceed the default 1m body size.
    client_max_body_size 20m;

    location / {
        proxy_pass http://chinatsu_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
